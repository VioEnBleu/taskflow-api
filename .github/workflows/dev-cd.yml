name: CD-dev

on:
    pull_request:
        branches: [dev]
    
    push:
        branches: [dev]

jobs:
    deploy:
        if: github.ref == 'refs/heads/main'

        runs-on: ubuntu-latest

        steps:
        - name: Trigger Render Deploy
          run: curl "$RENDER_DEPLOY_KEY_DEV"
          env: 
            RENDER_DEPLOY_KEY_DEV: ${{ secrets.RENDER_DEPLOY_KEY_DEV }}